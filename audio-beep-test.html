<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Audio beep test — MDXプレイヤー無音切り分け用</title>
<style>
  body { font-family: -apple-system, "Hiragino Sans", sans-serif; margin: 24px; line-height: 1.7; }
  button { font-size: 20px; padding: 14px 28px; margin: 8px 0; }
  pre { background: #f2f2f2; padding: 12px; white-space: pre-wrap; word-break: break-all; }
  .verdict { font-weight: bold; font-size: 18px; }
</style>
</head>
<body>
<h1>Audio beep test</h1>
<p>MDXプレイヤーとは無関係の、素のオシレーター音だけを鳴らす診断ページ。プレイヤーと同じ「ジェスチャ内で AudioContext を作り resume する」手順で鳴らす。</p>
<p>手順: このファイルを Safari の通常タブで開き、ボタンを押す。次にプライベートウィンドウで同じことをする。結果を比べる。</p>
<button id="beep">🔊 ビープを鳴らす（440Hz・1秒）</button>
<p class="verdict" id="verdict">まだ未実行</p>
<pre id="log">AudioContext: 未作成
</pre>
<script>
(function () {
  var logEl = document.getElementById('log');
  var verdictEl = document.getElementById('verdict');
  var actx = null, analyser = null, td = null;
  function log(s) { logEl.textContent += s + '\n'; }
  function snapshot(tag) {
    if (!actx) { log(tag + ': AudioContext なし'); return; }
    var rms = null;
    if (analyser && td) {
      analyser.getByteTimeDomainData(td);
      var sum = 0;
      for (var i = 0; i < td.length; i++) { var v = (td[i] - 128) / 128; sum += v * v; }
      rms = Math.sqrt(sum / td.length).toFixed(4);
    }
    log(tag + ': state=' + actx.state
      + ' sampleRate=' + actx.sampleRate
      + ' currentTime=' + actx.currentTime.toFixed(3)
      + ' baseLatency=' + (actx.baseLatency !== undefined ? actx.baseLatency : 'n/a')
      + ' outputLatency=' + (actx.outputLatency !== undefined ? actx.outputLatency : 'n/a')
      + ' analyserRMS=' + rms);
  }
  document.getElementById('beep').addEventListener('pointerdown', function () {
    logEl.textContent = '';
    log('UA: ' + navigator.userAgent);
    try {
      // プレイヤーと同じ手順: ジェスチャ内で生成し、resume する
      if (!actx) {
        var AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) { verdictEl.textContent = '❌ AudioContext がこのブラウザに無い'; return; }
        actx = new AC();
        analyser = actx.createAnalyser();
        analyser.fftSize = 2048;
        analyser.connect(actx.destination);
        td = new Uint8Array(analyser.fftSize);
        log('AudioContext 作成直後: state=' + actx.state);
      }
      var p = actx.resume();
      if (p && p.then) {
        p.then(function () {
          snapshot('resume後');
          playBeep();
        }).catch(function (e) { log('resume失敗: ' + e); });
      } else { snapshot('resume後'); playBeep(); }
    } catch (e) {
      verdictEl.textContent = '❌ 例外: ' + e;
      log('例外: ' + e);
    }
  });
  function playBeep() {
    var osc = actx.createOscillator();
    var gain = actx.createGain();
    osc.frequency.value = 440;
    gain.gain.setValueAtTime(0.5, actx.currentTime);
    gain.gain.setValueAtTime(0.0, actx.currentTime + 1.0);
    osc.connect(gain);
    gain.connect(analyser); /* プレイヤーと同じ analyser 経由で destination へ */
    osc.start();
    osc.stop(actx.currentTime + 1.05);
    setTimeout(function () {
      snapshot('発音中(0.5秒後)');
      setTimeout(function () { snapshot('発音後(1.2秒後)'); }, 700);
    }, 500);
    verdictEl.textContent = '▶ ビープを再生中。聞こえたかどうかと、下の analyserRMS を教えて。'
      + '（RMS が 0.1 以上なのに無音なら、信号は destination まで届いているのに出口で止まっている）';
  }
})();
</script>
</body>
</html>
